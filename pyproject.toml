[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ghostmcp"
version = "0.1.0"
description = "Ghost-native MCP (Model Context Protocol) client: list servers, list tools and call tools from a standard MCP config, offline against local stdio servers or over HTTP, stdlib only"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Ghost Developer Studio" }]
keywords = ["mcp", "model-context-protocol", "ghostide", "agents"]
dependencies = []

[project.scripts]
ghostmcp = "ghostmcp.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
